<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberwisp — Guard the Heartbloom</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #04121a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 30%, #0d2f33 0%, #04121a 70%);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 1.6));
    height: auto;
    aspect-ratio: 8 / 5;
    border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 179, 71, 0.14);
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
